[package]
name = "flightydeck"
version = "0.1.0"
edition = "2024"
description = "Unofficial CLI + MCP server for your Flighty flights (macOS). Not affiliated with Flighty."
license = "MIT"
repository = "https://github.com/theanhgen/flightydeck"
readme = "README.md"
keywords = ["flighty", "flights", "mcp", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "flighty"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive", "env"] }
rmcp = { version = "3.5", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
plist = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
regex = "1"
zeroize = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
base64 = "0.22"
rand = "0.9"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
